; AtmosphereMod settings. Edit while the sim runs and press Ctrl+Shift+F10 to
; apply them; Ctrl+Shift+F9 switches between the mod and the stock shaders.
; The AtmosphereMod app on the EFB tablet sets the main ones with sliders and
; saves them here (only their values change; these comments stay).
;
; These are the shipping defaults. The installer keeps your own copy of this
; file across updates and only adds settings that are new.

; ---------------------------------------------------------------- atmosphere
; T0 = 0 gives the sim's own atmosphere exactly.
;
; Weather: with T13 = 1 the sim's own METARs (passed on by the AtmosphereMod
; EFB app) set T1-T6, T9 and T10. The values below are then only used until
; the first METAR arrives; with T13 = 0 they are used as they are. Manual
; starting points: a clean mountain day as below; hazy or polluted lowland
; T3 = 8-14, T6 = 0.15-0.3, T10 = 1.0; humid or maritime haze T10 = 0.3.

; model mix: 0 = stock, 1 = the mod
T0 = 1
; boundary layer: top (km above sea level), edge width (km), haze (x the sim's surface haze)
T1 = 1.5
T2 = 0.15
T3 = 4
; free troposphere: haze (x the sim's surface haze), scale height (km)
T4 = 0.6
T5 = 2.5
; brown haze absorption in the boundary layer (0 = none)
T6 = 0.05
; aerosol backscatter lobe weight
T7 = 0.1
; sky colours: how strongly the air scatters sunlight and ozone absorbs it, in
; each colour channel. 0 = the sim's (ARPC's channel averages), 1 = fitted to a
; full-spectrum sky (closest to real at low sun and dusk: a blue sky overhead
; at sunset, the right orange of a low sun)
T8 = 1
; aerosol asymmetry g (forward-scattering peak, sun glare): 0 = the sim's 0.8;
; continental ~0.7. With T13 = 1 the weather adds its offsets to this, so lower
; = less glare everywhere
T9 = 0.7
; aerosol colour (Angstrom exponent): 0 = grey (the sim's), 0.3 humid or
; maritime white, 1.3 continental fine particles (bluish), 2 smoke
T10 = 1.3
; cloud haze colour: 0 = the sim's grey dimming of distant clouds, 1 = per
; colour (distant clouds turn creamy as blue light is scattered out)
T11 = 1
; far-slice stretch: 0 = stock, 1 = haze reaches clouds beyond 357 km (high altitude)
T12 = 1
; weather-driven haze: 0 = the values above, 1 = from the sim's METARs (blends in between)
T13 = 1
; ozone for the fitted sky colours (T8 = 1), in Dobson units. More ozone keeps
; the sky overhead bluer at dusk. 0 = by season and latitude, from a
; climatology of balloon and satellite measurements (~260 in the tropics, up
; to ~440 in Arctic spring); or a fixed amount (300 = the global average)
T14 = 0

; ---------------------------------------------------------------- clouds
; C0 = 0 gives the sim's own cloud lighting exactly; each of C2..C9, C12 and
; C16 at 0 keeps the sim's own behaviour for that part.
; C13..C15 are set by the add-on (your aircraft's attitude and wing span).

; cloud lighting mix: 0 = stock, 1 = the mod
C0 = 1
; forward lobe g (0..0.99): how tightly the silver lining hugs the sun, and
; the glow around the sun inside clouds (fog in front of the camera paints it
; over anything in front of the sun). Half width ~0.77 (1 - g) rad: 0.9 ~5 deg
; (broad), 0.95 ~2 deg, 0.97 ~1.2 deg (real 5-10 um droplets: ~1-2 deg),
; 0.99 ~0.4 deg (a sun-sized spot, like the sun shining through the aircraft).
; The sim's own forward lobe is 0.5
C1 = 0.9
; forward lobe weight (0..0.5): the share of the sim's forward lobe (0.5)
; moved to the sharper one. More = brighter silver linings within ~15 deg of
; the sun, less direct sunlight on clouds 30-90 deg from it (0.3: about -30 %),
; views away from the sun almost unchanged
C2 = 0.5

; multiple scattering: share of bounced light already at sunlit cloud edges
; (0..1). Bounced light has lost the silver-lining peak, so this brightens
; cloud sides (seen 30-120 deg from the sun) and trims the silver lining by the
; same share. Try 0.3-0.5
C3 = 0.4
; how forward the bounced light still scatters (0..0.9): 0 = evenly (the
; sim's), physically about half the droplets' g, so try 0.3-0.4. Higher =
; cloud interiors brighter toward the sun, a little darker away from it
C4 = 0.4
; sunlight deep inside clouds (fraction, 0 = the sim's 0.033): brighter
; interiors and bases, e.g. 0.06-0.12. The edge brightness stays as the sim's
C5 = 0.12

; seen with the sun behind you: bounced light builds up over the first metres
; inside a cloud, so edges and thin parts look grey and dense cores white,
; which outlines each turret (the "powder" effect). Strength (0..1); fades out
; toward the sun, so silver linings are untouched. Try 0.4-0.7
C6 = 0.5
; build-up depth (m inside the cloud; 0 = 100): larger = wider grey rims
C7 = 150
; crisper cloud edges: the sim fades density over ~220 m or more across every
; boundary; 1 halves that, 3 quarters it (0..8). Clouds keep their size.
; Too high may show noise at the edges
C8 = 0

; glory: coloured rings around the point opposite the sun (where your shadow
; falls on the cloud tops), blue inside, red outside, on sunlit cloud
; surfaces. Strength (0 = off); try 0.5-2
C9 = 0.5
; droplet radius (um; 0 = 10): smaller droplets = larger rings
; (10 um: first red ring ~2.4 deg from the centre, 5 um: ~5 deg)
C10 = 4
; droplet size spread (0 = 0.15): smaller = more rings (0.08: 3-4 visible)
C11 = 0.08

; your aircraft's shadow on the clouds (it marks the centre of the glory seen
; from the cockpit). With the sim's Raytraced Shadows off it is the aircraft's
; real outline, from the sun's shadow map, in any view; with them on it is
; traced from the sim's ray-tracing scene instead. Darkness of the shadow's
; core (0..1, 0 = off); its edges soften with distance, as the sun's disc
; blurs them (an airliner's wing loses its sharp core ~400 m below)
C12 = 0.4

; cloud optical thickness. The sim's clouds are far thinner than real ones:
; bases and edges see-through, the sun glowing through an overcast. Thickness
; at a cumulus core (0 = the sim's, off; 1 = the sim's at a core); try 2-4.
; Only what you see: the sim's lighting is kept, so clouds get more solid
; without getting darker
C16 = 2
; profile exponent (0 = 1 = the sim's profile): how quickly density builds up
; above a cloud's base. The sim's grows over 3 km, so bases and thin decks are
; nearly transparent; 0.33 is like real clouds (solid from the base up), 0.5
; in between
C17 = 0.33
; clouds return to the sim's thin, translucent profile toward this altitude
; (m above sea level, 0 = 6000), blended over the 3 km below it: cirrus and
; thin mid-level sheets stay translucent with soft edges, low clouds and
; cumulus solid
C18 = 0
; ... scaled by this (0 = 1 = the sim's): higher = more visible cirrus (2-3),
; but thick icy layers at cruise get more fog-like
C19 = 1.5

; METAR anchoring (live weather only): near weather stations, the sim's live
; clouds are pulled toward the layers the stations actually report (base,
; cover, CB/TCU), from the sim's own METARs (the AtmosphereMod EFB app). Below
; what a METAR describes (about 12,000 ft above the station, 5,000 ft with
; CAVOK/NSC, or the top of an overcast) the reported layers replace the sim's
; clouds; above, the sim's own stay. Up to 8 stations at once (the nearest,
; the ones passed, the ones ahead), blended by distance; new stations fade in
; over 3 min, a new METAR crossfades over 5 min. Weather presets and
; third-party weather keep their own layers.
; Strength (0 = off, 1 = the METARs' layers within the radius)
C20 = 1
; radius (km, 0 = 20): each station's full strength within it, fading out over
; the same distance beyond (so ~2x the radius to the sim's own weather)
C21 = 50
; daylight white balance (0 = off, 1 = on): the sim's sun is the real colour
; of sunlight above the atmosphere (the measured solar spectrum), slightly warm
; against the screen's white, so sunlit cloud interiors look cream. 1 makes
; sunlight read as white, as your eyes would see it; the sky, clouds and
; terrain shift alike
C22 = 1

; cloud types (live weather only). Real clouds aren't all equally solid:
; cumulus (and towering cumulus, CB) are dense with crisp edges, while
; stratocumulus, stratus, altocumulus and altostratus hold less water, spread
; more evenly, with softer edges. The sim's weather has no cloud types, so
; they are told apart by each layer's height, depth and cover: thin broken or
; overcast decks are stratiform, and so are a few scattered clouds below
; ~500-750 m above the ground (stratus fractus); other scattered low cloud and
; deep cloud are cumulus, cirrus stays as it is. The stratiform types keep the
; sim's soft edges, and altocumulus and altostratus also softer bases
; (altostratus: a veil the sun can shine through); cumulus edges get at least
; C8 = 1.
; Strength (0 = every cloud like cumulus, 1 = by type)
C23 = 1
; each type's thickness, as a share of C16 (0..1, 0 = the sim's own):
; stratocumulus, stratus, altocumulus, altostratus
C24 = 0.6
C25 = 0.5
C26 = 0.4
C27 = 0.3

; cloud surface detail. The sim roughens every cloud surface with the same
; ~100-250 m round puffs, which look like popcorn on cloud bases once clouds
; are solid (C16/C17). Smooth bases (0..1, 0 = the sim's puffs everywhere,
; 1 = none at the base): the puffs fade out toward each cloud's base, so bases
; are flat and tops keep their billows
C28 = 1
; ... over this height above the base (m, 0 = 300)
C29 = 300
; finer billows on the billows (0 = off, try 0.01-0.03): a second, smaller
; layer of detail on cloud tops and sides (none at the base), so turrets
; aren't all one size; can look spongy
C30 = 0
; ... their size (m period, 0 = 350; smaller = finer)
C31 = 600
