<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AtmosphereMod EFB harness</title>
  <style>
    /* the sim's tablet has these four faces (notes/efb-ui.md): the nearest ones on this PC */
    @font-face { font-family: Roboto-Light; src: local("Roboto Light"), local("Roboto-Light"), local("Segoe UI Light"); }
    @font-face { font-family: Roboto-Regular; src: local("Roboto"), local("Roboto-Regular"), local("Segoe UI"); }
    @font-face { font-family: Roboto-Medium; src: local("Roboto Medium"), local("Roboto-Medium"), local("Segoe UI Semibold"); }
    @font-face { font-family: Roboto-Bold; src: local("Roboto Bold"), local("Roboto-Bold"), local("Segoe UI Bold"); }
    html, body { margin: 0; height: 100%; background: #0b0d11; color: #cfd6e0; font: 14px/1.4 "Segoe UI", sans-serif; }
    #strip { position: fixed; left: 0; top: 0; bottom: 0; width: 300px; overflow-y: auto; padding: 12px 14px;
      box-sizing: border-box; background: #15191f; border-right: 1px solid #252b34; }
    #strip h1 { font-size: 15px; margin: 0 0 10px; }
    #strip h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.55; margin: 16px 0 6px; }
    #strip button { display: block; width: 100%; margin: 0 0 4px; padding: 6px 8px; text-align: left; cursor: pointer;
      background: #222833; color: #cfd6e0; border: 1px solid #2c3441; border-radius: 4px; font: inherit; }
    #strip button.on { background: #2f6fed; border-color: #2f6fed; color: #fff; }
    #strip label { display: block; margin: 4px 0; cursor: pointer; }
    #log { font: 11px/1.35 Consolas, monospace; white-space: pre-wrap; word-break: break-all; opacity: 0.8; }
    #note { font-size: 12px; opacity: 0.6; }
    #stage { position: fixed; left: 300px; top: 0; right: 0; bottom: 0; overflow: hidden; }
    #scaler { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    .tablet { position: absolute; background: #050608; border-radius: 28px; box-shadow: 0 0 0 2px #23272e, 0 20px 60px #000; }
    .app { position: absolute; overflow: hidden; background: #000; }
    .statusbar { position: absolute; left: 0; right: 0; top: 0; pointer-events: none; display: flex; align-items: center;
      justify-content: center; color: #fff; font-weight: 600; }
    .statusbar .bell { position: absolute; width: 14px; height: 14px; border-radius: 3px; background: #fff; opacity: 0.85; }
    .dock { position: absolute; bottom: 0; background: rgba(40, 44, 52, 0.92); border-radius: 22%; pointer-events: auto;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15); }
  </style>
</head>
<body>
  <div id="strip">
    <h1>AtmosphereMod EFB harness</h1>
    <div id="note">The UI module (src/ui) with a fake add-on, in modern Chrome: for layout, logic and wiring. The
      sim's engine (CoherentGT 2.0) can still differ: check there with tools/efb_reload.py.</div>
    <h2>Tablet</h2>
    <div id="sizes"></div>
    <label>sim window: <select id="window">
      <option value="0.8">smaller (x 0.8)</option>
      <option value="1">as measured first (x 1)</option>
      <option value="1.433">as measured second (x 1.43)</option>
      <option value="1.8">larger (x 1.8)</option>
    </select></label>
    <label>UI variant: <select id="theme"><option value="auto">auto</option><option value="dark">dark</option><option value="light">light</option></select></label>
    <label>the sim's time of day: <select id="daytime"><option value="1">day</option><option value="0">dawn</option>
      <option value="2">dusk</option><option value="3">night</option></select></label>
    <label>GitHub's latest release: <select id="latest">
      <option value="v0.8.0">v0.8.0 (newer)</option><option value="v0.7.3">v0.7.3 (the same)</option>
      <option value="">unreachable</option></select></label>
    <label><input type="checkbox" id="fit" checked> fit the tablet into the window</label>
    <label><input type="checkbox" id="overlays" checked> the sim's status bar and dock button</label>
    <h2>Add-on</h2>
    <label><input type="checkbox" id="connected" checked> answers (unchecked: an add-on that never does)</label>
    <button id="reset">reset its state to the fixture</button>
    <h2>Messages to the add-on</h2>
    <div id="log"></div>
  </div>
  <div id="stage"><div id="scaler"></div></div>
  <script src="build/harness.js"></script>
</body>
</html>
